<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qudor AI Viewer</title>
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--text:#172033;--muted:#667085;--line:#dbe3ef;--blue:#2563eb;--orange:#e45f2b;--legal:#16a34a;--wood:#dce8f4;--wall-blue:#1d4ed8;--wall-orange:#c2410c;--wall-thick:5px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",Arial,sans-serif}.app{max-width:1440px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.header h1{font-size:24px;margin:0}.status{padding:8px 12px;border-radius:999px;background:#e8eefc;color:#24499b;font-weight:700}.layout{display:grid;grid-template-columns:minmax(560px,1fr) 430px;gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(31,52,82,.07)}
    .board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr) 8px) minmax(0,1fr);grid-template-rows:repeat(8,minmax(0,1fr) 8px) minmax(0,1fr);aspect-ratio:1;background:#b8c9dc;padding:10px;border-radius:14px;overflow:hidden}.cell{border:0;border-radius:7px;background:var(--wood);position:relative;min-width:0;cursor:default}.cell.legal{cursor:pointer;background:#cdeed7;box-shadow:inset 0 0 0 3px var(--legal)}.cell.legal::after{content:"";position:absolute;width:15%;aspect-ratio:1;border-radius:50%;background:var(--legal);inset:42.5%}.cell:focus-visible,.wall-slot:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #60a5fa;outline-offset:2px}.pawn{position:absolute;inset:20%;border-radius:50%;box-shadow:0 4px 9px #0004;z-index:4}.pawn.blue{background:var(--blue)}.pawn.orange{background:var(--orange)}
    .wall-slot{border:0;padding:0;background:transparent;z-index:5;position:relative}.wall-slot.selectable{cursor:pointer}.wall-slot.invalid{pointer-events:none}
    /* The slot button fills its whole grid track so it stays easy to click, but the wall
       itself is drawn as a thin centred bar inside it. Painting the track background made
       every wall as thick as the gap between cells, which read as a solid block. */
    .wall-slot::after{content:"";position:absolute;border-radius:2px;pointer-events:none}
    .wall-slot.wh::after{left:3%;right:3%;top:50%;height:var(--wall-thick);transform:translateY(-50%)}
    .wall-slot.wv::after{top:3%;bottom:3%;left:50%;width:var(--wall-thick);transform:translateX(-50%)}
    .wall-slot.selectable::after{background:#22c55eaa}.wall-slot.selectable:hover::after{background:var(--legal)}
    .wall-slot.placed.blue::after{background:var(--wall-blue)}.wall-slot.placed.orange::after{background:var(--wall-orange)}.controls,.segmented{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}button,select,input{font:inherit}button,select{min-height:44px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:8px 12px;color:var(--text)}button{cursor:pointer;font-weight:650}button:hover:not(:disabled){background:#f1f5f9}button.active{background:#dcfce7;border-color:#16a34a;color:#166534}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{cursor:not-allowed;opacity:.45}.hint{color:var(--muted);margin:10px 0 0;font-size:14px}.section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #edf1f6}.section:last-child{border:0;margin:0}.section h2{font-size:15px;margin:0 0 10px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:13px;color:var(--muted);font-weight:600}.field select{width:100%}.speed{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f5f7fa;border-radius:10px;padding:10px}.stat strong{display:block;font-size:19px}.stat span{color:var(--muted);font-size:12px}.list{max-height:155px;overflow:auto;border-top:1px solid #edf1f6;font-size:13px}.item{display:flex;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid #edf1f6}.item.src-head{background:#eef2f8;font-weight:700;color:#334155;font-size:12px;padding:5px 6px;position:sticky;top:0}#metrics{max-height:220px}.toast{min-height:22px;margin-top:10px;font-weight:600;color:#b42318}.legend{display:flex;gap:14px;color:var(--muted);font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}.dot.blue{background:var(--wall-blue)}.dot.orange{background:var(--wall-orange)}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.board{max-width:720px;margin:auto}}@media(max-width:620px){.app{padding:10px}.panel{padding:10px}.layout{display:block}.layout>.panel+ .panel{margin-top:12px}.board{padding:6px;--wall-thick:4px;grid-template-columns:repeat(8,minmax(0,1fr) 6px) minmax(0,1fr);grid-template-rows:repeat(8,minmax(0,1fr) 6px) minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body><main class="app"><header class="header"><div><h1>Qudor AI Viewer</h1><div class="hint">Локальная игра и диагностика модели</div></div><div id="status" class="status">Загрузка…</div></header><div class="layout"><section class="panel"><div id="board" class="board" aria-label="Доска Quoridor"></div><div class="controls"><button id="newGame" class="primary">Новая партия</button><button id="pawnMode" class="active">Ход пешкой</button><button id="wallH">Стена ↔</button><button id="wallV">Стена ↕</button></div><p id="hint" class="hint">Зелёным отмечены клетки, куда можно пойти.</p><div class="legend"><span><i class="dot blue"></i>стены синего</span><span><i class="dot orange"></i>стены оранжевого</span></div><div id="toast" class="toast" role="status"></div></section><aside class="panel"><section class="section"><h2>Настройки игры</h2><div class="field"><label for="mode">Режим</label><select id="mode"><option value="human">Человек против ИИ</option><option value="ai">ИИ против ИИ</option></select></div><div class="field"><label for="checkpoint">Checkpoint</label><select id="checkpoint"></select></div><button id="loadModel">Загрузить модель</button><div class="field" style="margin-top:10px"><label for="speed">Скорость воспроизведения</label><div class="speed"><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="speedValue">1×</output></div></div><div class="controls"><button id="pause">Пауза</button><button id="step">Один шаг ИИ</button></div></section><section class="section"><h2>Позиция</h2><div class="stats"><div class="stat"><strong id="plies">0</strong><span>полуходов</span></div><div class="stat"><strong id="turn">Синий</strong><span>ходит</span></div><div class="stat"><strong id="wallsBlue">10</strong><span>стен синего</span></div><div class="stat"><strong id="wallsOrange">10</strong><span>стен оранжевого</span></div></div></section><section class="section"><h2>Оценка модели (softmax по логитам)</h2><div id="probs" class="list"></div></section><section class="section"><h2>История партии</h2><div id="history" class="list"></div></section><section class="section"><h2>Метрики обучения</h2><div id="metrics" class="list"></div></section></aside></div></main>
<script>
const $=id=>document.getElementById(id);
let state=null,inputMode='pawn',requestBusy=false,pollBusy=false,csrfToken=null,lastSignature='',metricsCache=null;

async function api(path,options){const r=await fetch('/api/'+path,options);const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка запроса');return data}
function post(path,body={}){const headers={'Content-Type':'application/json'};if(csrfToken)headers['X-Qudor-Token']=csrfToken;return api(path,{method:'POST',headers,body:JSON.stringify(body)})}
function message(text,error=false){$('toast').textContent=text;$('toast').style.color=error?'#b42318':'#166534'}

function stateSignature(){if(!state)return'';return`${state.p0},${state.p1},${state.hc.join()},${state.vc.join()},${state.player},${state.winner},${state.draw},${state.mode},${inputMode},${state.legal.join()},${state.thinking},${state.paused},${state.error}`}

function outcome(){if(state.winner!==null)return state.winner===0?'Победил синий':'Победил оранжевый';if(state.draw)return`Ничья: лимит ${state.maxPlies} полуходов`;return null}

function softmax(scores){const max=Math.max(...scores);const exps=scores.map(s=>Math.exp(s-max));const sum=exps.reduce((a,b)=>a+b,0);return exps.map(e=>e/sum)}

function renderBoard(){const b=$('board');b.replaceChildren();const legal=new Set(state.legal);const owner=new Map();state.hc.forEach((x,i)=>owner.set(81+x,(state.hcOwner||[])[i]===0?'blue':'orange'));state.vc.forEach((x,i)=>owner.set(145+x,(state.vcOwner||[])[i]===0?'blue':'orange'));const placedH=new Set(state.hc),placedV=new Set(state.vc),okH=new Set(state.legalWallsH),okV=new Set(state.legalWallsV);for(let r=0;r<9;r++)for(let c=0;c<9;c++){const i=r*9+c,cell=document.createElement('button');cell.className='cell';cell.style.gridRow=String(r*2+1);cell.style.gridColumn=String(c*2+1);cell.setAttribute('aria-label',`Клетка ${r+1}, ${c+1}`);const canMove=inputMode==='pawn'&&state.mode==='human'&&state.player===0&&!state.thinking&&legal.has(i);if(canMove){cell.classList.add('legal');cell.onclick=()=>play(i)}else cell.disabled=true;if(i===state.p0||i===state.p1){const p=document.createElement('i');p.className='pawn '+(i===state.p0?'blue':'orange');cell.append(p)}b.append(cell)}
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const x=r*8+c;for(const o of ['h','v']){const action=(o==='h'?81:145)+x,slot=document.createElement('button'),placed=(o==='h'?placedH:placedV).has(x),allowed=(o==='h'?okH:okV).has(x);slot.className='wall-slot '+(o==='h'?'wh':'wv');slot.style.gridRow=o==='h'?String(r*2+2):`${r*2+1} / span 3`;slot.style.gridColumn=o==='h'?`${c*2+1} / span 3`:String(c*2+2);slot.setAttribute('aria-label',`${o==='h'?'Горизонтальная':'Вертикальная'} стена ${r+1}, ${c+1}`);if(placed)slot.classList.add('placed',owner.get(action)||'orange');else if(inputMode===o&&state.mode==='human'&&state.player===0&&!state.thinking&&allowed){slot.classList.add('selectable');slot.onclick=()=>play(action)}else{slot.classList.add('invalid');slot.disabled=true}b.append(slot)}}}

async function play(action){if(requestBusy||!state||state.player!==0||state.thinking||!state.legal.includes(action))return;requestBusy=true;message('Ход принят, ИИ думает…');try{await post('action',{action});await refresh()}catch(e){message(e.message,true)}finally{requestBusy=false}}

function actionName(a){if(a<81)return `пешка → ${Math.floor(a/9)+1}:${a%9+1}`;const x=a-(a<145?81:145);return `${a<145?'стена ↔':'стена ↕'} ${Math.floor(x/8)+1}:${x%8+1}`}

function render(){const sig=stateSignature();if(sig===lastSignature)return;lastSignature=sig;renderBoard();const done=outcome();$('plies').textContent=state.maxPlies?`${state.ply} / ${state.maxPlies}`:state.ply;$('turn').textContent=done?'—':state.player===0?'Синий':'Оранжевый';$('wallsBlue').textContent=state.walls0;$('wallsOrange').textContent=state.walls1;$('mode').value=state.mode;$('pause').textContent=state.paused?'Продолжить':'Пауза';$('pause').disabled=state.thinking||!!done;$('step').disabled=state.thinking||!!done;$('status').textContent=done||(state.thinking?'ИИ думает…':state.player===0?'Ваш ход':'Ход ИИ');if(state.probs.length){const scores=state.probs.map(x=>x.score);const probs=softmax(scores);$('probs').innerHTML=state.probs.map((x,i)=>`<div class="item"><span title="логит: ${x.score.toFixed(3)}">${actionName(x.action)}</span><strong>${(probs[i]*100).toFixed(1)}%</strong></div>`).join('')}else{$('probs').innerHTML='<div class="item">Пока нет оценки</div>'}const hidden=(state.historyTotal||state.history.length)-state.history.length;$('history').innerHTML=state.history.length?[...state.history].reverse().map(x=>`<div class="item"><span>#${x.ply} ${x.player===0?'Синий':'Оранжевый'}</span><span>${actionName(x.action)}</span></div>`).join('')+(hidden>0?`<div class="item"><span>…ещё ${hidden} ходов не показано</span></div>`:''):'<div class="item">Партия не началась</div>';const walls=inputMode==='h'?'горизонтальные':inputMode==='v'?'вертикальные':null;$('hint').textContent=walls?`Зелёным отмечены только легальные ${walls} стены.`:'Зелёным отмечены клетки, куда можно пойти.';if(state.error){message(state.error,true)}}

async function refresh(){if(pollBusy)return;pollBusy=true;try{state=await api('state');render()}catch(e){message(e.message,true)}finally{pollBusy=false}}

async function updateMetrics(){try{const xs=await api('metrics');if(JSON.stringify(xs)===metricsCache)return;metricsCache=JSON.stringify(xs);const grouped={};for(const row of xs){const src=row.source||'unknown';if(!grouped[src])grouped[src]=[];grouped[src].push(row)}let html='';for(const[src,rows]of Object.entries(grouped)){const label=src.replace(/\/metrics\.csv$/,'')||src;const recent=rows.slice(-4).reverse();html+=`<div class="item src-head" title="${src}"><span>${label}</span><span>${rows.length} строк</span></div>`;html+=recent.map(x=>`<div class="item"><span>iter ${x.iteration}${x.device?' · '+x.device:''}</span><strong>${Number(x.total_loss||0).toFixed(3)}</strong></div>`).join('')}$('metrics').innerHTML=html||'<div class="item">Метрики не найдены</div>'}catch(e){}}

function setInputMode(mode){inputMode=mode;for(const[id,m]of[['pawnMode','pawn'],['wallH','h'],['wallV','v']])$(id).classList.toggle('active',m===mode);lastSignature='';render()}

$('pawnMode').onclick=()=>setInputMode('pawn');$('wallH').onclick=()=>setInputMode('h');$('wallV').onclick=()=>setInputMode('v');$('newGame').onclick=async()=>{await post('reset');inputMode='pawn';lastSignature='';await refresh()};$('loadModel').onclick=async()=>{try{await post('model',{path:$('checkpoint').value});message('Модель загружена');await refresh()}catch(e){message('Модель не загружена: '+e.message,true)}};$('mode').onchange=async()=>{await post('settings',{mode:$('mode').value,speed:+$('speed').value,paused:false});await refresh()};$('speed').oninput=()=>{$('speedValue').value=$('speed').value+'×'};$('speed').onchange=()=>post('settings',{mode:$('mode').value,speed:+$('speed').value,paused:state.paused});$('pause').onclick=async()=>{await post('settings',{mode:$('mode').value,speed:+$('speed').value,paused:!state.paused});await refresh()};$('step').onclick=async()=>{await post('step');await refresh()};$('step').title='Снять паузу и дать ИИ продолжить';

(async()=>{try{const t=await api('token');csrfToken=t.token}catch(e){message('Нет CSRF-токена — управление недоступно, перезагрузите страницу',true)}
try{const xs=await api('models');$('checkpoint').innerHTML=xs.map(x=>`<option value="${x}">${x}</option>`).join('');if(xs.length&&csrfToken){try{await post('model',{path:xs[0]});message('Модель загружена: '+xs[0])}catch(e){message('Стартовая модель недоступна: '+e.message,true)}}else if(!xs.length){message('Checkpoint-файлы не найдены',true)}}catch(e){message('Не удалось получить список моделей: '+e.message,true)}
await updateMetrics();refresh();setInterval(refresh,800);setInterval(updateMetrics,10000)})();
</script></body></html>
